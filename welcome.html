<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Thank You · Kaito Ota</title>

  <!-- favicon -->
  <link rel="icon" href="https://ik.imagekit.io/bebell/ONTO.DEV/onto-3d-icon.webp">

  <!-- Google Fonts: Oxanium (weights 400, 700) + Noto Serif JP for the signature -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&family=Oxanium:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome for subtle icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #000000; /* solid black, no containers */
      font-family: 'Oxanium', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      color: #ffffff;
    }

    /* Everything sits directly on black – no card, no borders, no background boxes */
    .content {
      max-width: 640px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    /* ------------------------------------------------------------------
       LOAD REVEAL ANIMATION (identical to coming-soon page)
    ------------------------------------------------------------------ */
    @keyframes revealUp {
      0% {
        opacity: 0;
        transform: translate3d(0, 34px, 0) scale(0.97);
        filter: blur(14px);
      }
      55% {
        opacity: 1;
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
        filter: none;
      }
    }

    .reveal {
      opacity: 0;
      animation: revealUp 1.05s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: var(--d, 0s);
    }

    /* Video – same sizing as the coming-soon page */
    .video-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .video-wrapper video {
      width: 250px;
      height: auto;
      border-radius: 1.2rem;
      display: block;
      background: transparent;
      margin-bottom: 0;
    }

    /* Title — Oxanium Bold 700, gradient white→grey (same as coming-soon) */
    h1 {
      font-family: 'Oxanium', sans-serif;
      font-weight: 700;
      font-size: 2.8rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff, #a0a0a0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0;
    }

    .subhead {
      font-family: 'Oxanium', sans-serif;
      font-weight: 400;
      font-size: 1.15rem;
      color: #9a9a9a;
      letter-spacing: 0.6px;
      margin: 0;
    }

    /* Small reassurance line – mirrors the privacy note styling */
    .privacy-note {
      font-family: 'Oxanium', sans-serif;
      font-weight: 400;
      font-size: 0.75rem;
      color: #4a4a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 0.2rem;
    }

    .privacy-note i {
      font-size: 0.65rem;
    }

    /* ------------------------------------------------------------------
       SIGNATURE BLOCK
       Vertical Japanese signature in brand primary (#a7da32),
       with a thin lime rule and the romaji name underneath.
    ------------------------------------------------------------------ */
    .signature-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      margin-top: 1.6rem;
      padding-top: 1.6rem;
      position: relative;
      width: 100%;
      max-width: 260px;
    }

    /* Thin horizontal rule above the signature */
    .signature-block::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        #a7da32 40%,
        #a7da32 60%,
        transparent
      );
      opacity: 0.7;
    }

    /* Vertical Japanese signature */
    .signature-jp {
      font-family: 'Noto Serif JP', 'Oxanium', serif;
      font-weight: 600;
      font-size: 2.4rem;
      line-height: 1;
      color: #a7da32;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.35em;
      /* subtle glow in the brand color */
      text-shadow: 0 0 24px rgba(167, 218, 50, 0.35);
      /* compensate for letter-spacing so the block stays centered */
      padding-left: 0.35em;
      user-select: none;
    }

    /* Romaji name below the signature */
    .signature-romaji {
      font-family: 'Oxanium', sans-serif;
      font-weight: 400;
      font-size: 0.85rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #6a6a6a;
      padding-left: 0.5em; /* balance the letter-spacing */
    }
    
    
    
    
/* ===== NEON CURSOR TRAIL (lime #a7da32 palette) ===== */
  #neon-trail-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;   /* never blocks clicks */
    z-index: 9999;          /* above page content */
    opacity: 0;
    transition: opacity .5s ease-out;
  }
  @media (pointer: coarse), (prefers-reduced-motion: reduce) {
    #neon-trail-canvas { display: none !important; }
  }
  
  
    
    
    

    /* A small "— signed —" style caption is unnecessary; the rule + name carry it */

    /* Responsive adjustments – identical breakpoints to coming-soon */
    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      .subhead {
        font-size: 1rem;
      }
      .video-wrapper video {
        width: 220px;
      }
      .signature-jp {
        font-size: 2rem;
      }
      .signature-romaji {
        font-size: 0.75rem;
        letter-spacing: 0.4em;
      }
    }

    @media (min-width: 381px) {
      .video-wrapper video {
        width: 250px;
      }
    }

    /* Respect users who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      .reveal {
        animation: none;
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
  </style>
</head>
<body>
  <div class="content">
  
  
  
     <!-- ============ NEON CURSOR TRAIL  ============ -->
    <canvas id="neon-trail-canvas" aria-hidden="true"></canvas>


  
    <!-- Video: autoplay + loop + muted + playsinline (same asset as coming-soon) -->
    <div class="video-wrapper reveal" style="--d: 0.05s;">
      <video
        autoplay
        loop
        muted
        playsinline
        width="250"
        style="width:350px; height:auto;"
      >
        <source src="https://ik.imagekit.io/bebell/ONTO.DEV/Hero-Banners.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <h1 class="reveal" style="--d: 0.20s;">Thank You</h1>
    <div class="subhead reveal" style="--d: 0.32s;">You're on the list! We'll be in touch soon.</div>

    <!-- Signature: vertical Japanese name in brand primary + romaji below -->
    <div class="signature-block reveal" style="--d: 0.48s;">
      <span class="signature-jp" aria-label="Kaito Ota">海斗太田</span>
      <span class="signature-romaji">Kaito Ota</span>
    </div>

    <div class="privacy-note reveal" style="--d: 0.62s;">
      <i class="fas fa-heart"></i> Crafted with care
    </div>
  </div>

  <script>
    (function () {
      // Preserve the same robust video autoplay handling as the coming-soon page
      const video = document.querySelector('video');
      if (video) {
        video.setAttribute('playsinline', '');
        video.setAttribute('muted', '');
        video.muted = true;
        video.play().catch(function (err) {
          console.warn('Autoplay was prevented:', err);
          const playOnInteraction = function () {
            video.play().catch(() => {});
            document.removeEventListener('click', playOnInteraction);
          };
          document.addEventListener('click', playOnInteraction, { once: true });
        });
      }
    })();
  </script>




   <!-- Interactive cursor trail --> 
  <script>
(function () {
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (isTouch || reducedMotion) return;

  // Create canvas if it doesn't exist — makes this truly drop-in
  let canvas = document.getElementById('neon-trail-canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id = 'neon-trail-canvas';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);
  }

  const ctx = canvas.getContext('2d');

  // ---- DPI-aware sizing (full viewport) ----
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ================================================================
  //  STATE
  // ================================================================
  const TRAIL_LENGTH    = 26;
  const POINT_LIFETIME  = 420;
  const LINE_WIDTH      = 6;
  const SUBSTEPS        = 4;
  const STAR_RATE       = 0.55;

  const points = [];
  const stars  = [];

  let lastX = -9999, lastY = -9999;
  let raf = null;

  function spawnStar(x, y) {
    stars.push({
      x, y,
      born: performance.now(),
      vx: (Math.random() - 0.5) * 0.9,
      vy: 0.15 + Math.random() * 0.55,
      size: 1.8 + Math.random() * 2.6,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.06
    });
  }

  // ================================================================
  //  INPUT — listen on window, coordinates are already viewport-relative
  // ================================================================
  window.addEventListener('mousemove', (e) => {
    canvas.style.opacity = '1';

    const x = e.clientX;
    const y = e.clientY;

    const dx = x - lastX;
    const dy = y - lastY;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.5) return;

    for (let i = 1; i <= SUBSTEPS; i++) {
      const t = i / SUBSTEPS;
      const px = lastX + dx * t;
      const py = lastY + dy * t;
      points.push({ x: px, y: py, born: performance.now() });
      if (Math.random() < STAR_RATE * 0.35) spawnStar(px, py);
    }
    if (points.length > TRAIL_LENGTH) points.splice(0, points.length - TRAIL_LENGTH);

    lastX = x;
    lastY = y;

    if (raf === null) raf = requestAnimationFrame(render);
  });

  window.addEventListener('mouseleave', () => {
    canvas.style.opacity = '0';
    points.length = 0;
    stars.length  = 0;
    lastX = lastY = -9999;
  });

  // ================================================================
  //  DRAW STAR
  // ================================================================
  function drawStar(s, alpha, scale) {
    const r = s.size * scale;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);

    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.4);
    grad.addColorStop(0,   `rgba(233, 255, 176, ${alpha * 0.9})`);
    grad.addColorStop(0.5, `rgba(167, 218, 50, ${alpha * 0.4})`);
    grad.addColorStop(1,   `rgba(167, 218, 50, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = `rgba(233, 255, 176, ${alpha})`;
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -r);  ctx.lineTo(0, r);
    ctx.moveTo(-r, 0);  ctx.lineTo(r, 0);
    const d = r * 0.55;
    ctx.moveTo(-d, -d); ctx.lineTo(d, d);
    ctx.moveTo(-d,  d); ctx.lineTo(d, -d);
    ctx.stroke();

    ctx.restore();
  }

  // ================================================================
  //  RENDER
  // ================================================================
  function render() {
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    while (points.length && now - points[0].born > POINT_LIFETIME) points.shift();
    for (let i = stars.length - 1; i >= 0; i--) {
      if (now - stars[i].born > 900) stars.splice(i, 1);
    }

    if (points.length >= 2) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // outer glow
      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1], b = points[i];
        const t = i / points.length;
        const age = 1 - Math.min((now - b.born) / POINT_LIFETIME, 1);
        const strength = t * age;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        ctx.quadraticCurveTo(a.x, a.y, mx, my);
        ctx.strokeStyle = `rgba(167, 218, 50, ${strength * 0.32})`;
        ctx.lineWidth = LINE_WIDTH * 2.6 * strength;
        ctx.stroke();
      }

      // inner core
      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1], b = points[i];
        const t = i / points.length;
        const age = 1 - Math.min((now - b.born) / POINT_LIFETIME, 1);
        const strength = t * age;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        ctx.quadraticCurveTo(a.x, a.y, mx, my);
        ctx.strokeStyle = `rgba(233, 255, 176, ${strength * 0.85})`;
        ctx.lineWidth = LINE_WIDTH * strength;
        ctx.stroke();
      }
    }

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const age = (now - s.born) / 900;
      if (age >= 1) continue;

      s.x += s.vx;
      s.y += s.vy;
      s.rot += s.vr;

      const fade    = 1 - age;
      const twinkle = 0.6 + 0.4 * Math.sin(now * 0.015 + i);
      const alpha   = fade * twinkle;
      const scale   = 0.6 + (1 - fade) * 0.9;

      drawStar(s, alpha, scale);
    }

    // Keep looping while there's anything to animate
    if (points.length || stars.length) {
      raf = requestAnimationFrame(render);
    } else {
      raf = null;
      ctx.clearRect(0, 0, W, H);
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
    } else if (raf === null && (points.length || stars.length)) {
      raf = requestAnimationFrame(render);
    }
  });
})();
</script>



</body>
</html>
